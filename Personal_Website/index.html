<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="style.css" rel="stylesheet" />
    <title>Emira's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kameron:wght@400..700&family=Monsieur+La+Doulaise&family=Montenegrin+Gothic+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--Header Menu-->
    <header class="site-header sticky-top" id="siteHeader">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid px-lg-5">
          <a class="navbar-brand" href="#">EMIRA</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarNavAltMarkup"
          >
            <div class="navbar-nav">
              <a class="nav-link active" aria-current="page" href="#">WORK</a>
              <a class="nav-link" href="#">ABOUT</a>
              <a class="nav-link" href="#">CONTENT</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <section>
      <div class="d-flex justify-content-evenly align-items-center vh-100">
        <div class="row">
          <!-- Left Column: Introduction -->
          <div class="col">
            <h1 class="w-25 myname">Hi, Iam Mohammed Emira</h1>
          </div>
          <!-- Right Column: Placeholder for future content -->
          <div class="col">
            <img
              src="..."
              class="col-md-6 float-md-end mb-3 ms-md-3"
              alt="..."
            />
          </div>
        </div>
      </div>
    </section>

    <!--Footer-->
    <footer class="bg-body-tertiary text-body-secondary py-5">
      <div class="container px-lg-5">
        <div class="row gy-4 justify-content-between text-start">
          <!--Left Column: Contact Info-->
          <div class="col-md-5">
            <h1 class="mb-3">LET'S CONNECT</h1>
            <p>
              Say hello at
              <a
                href="mailto:emiradev909@gmail.com"
                class="text-decoration-none"
                >emiradev909@gmail.com</a
              >
            </p>
            <p class="mb-4">
              For more info, here's
              <a
                href="./docs/Mohammed Mustafa Emira Resume.pdf"
                download
                class="text-decoration-none fw-bold"
                >Resume</a
              >
            </p>

            <!-- Social Grid with correct closing div tag -->
            <div
              style="grid-template-columns: repeat(3, max-content)"
              class="d-grid gap-3"
            >
              <div>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="25"
                  height="25"
                  fill="currentColor"
                  class="bi bi-linkedin"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .694.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z"
                  />
                </svg>
              </div>
              <div>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="25"
                  height="25"
                  fill="currentColor"
                  class="bi bi-github"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
                  />
                </svg>
              </div>
              <div>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="25"
                  height="25"
                  fill="currentColor"
                  class="bi bi-telephone"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"
                  />
                </svg>
              </div>
            </div>
          </div>

          <!--Right Column: Contact Form with Clean Grid Row Flow-->
          <div class="col-md-6">
            <form>
              <div class="row g-3">
                <div class="col-12">
                  <label for="formName" class="form-label">Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="formName"
                    placeholder="Your name"
                  />
                </div>
                <div class="col-12">
                  <label for="formEmail" class="form-label"
                    >Email address</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="formEmail"
                    placeholder="name@example.com"
                  />
                </div>
                <div class="col-12">
                  <label for="formSubject" class="form-label">Subject</label>
                  <input
                    type="text"
                    class="form-control"
                    id="formSubject"
                    placeholder="How can I help?"
                  />
                </div>
                <div class="col-12">
                  <label for="formMessage" class="form-label">Message</label>
                  <textarea
                    class="form-control"
                    id="formMessage"
                    rows="4"
                    placeholder="Write your message here..."
                  ></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-dark px-4">
                    Submit
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
